name: Bug 报告
description: 报告可复现的问题
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        感谢反馈！提交前请先搜索现有 Issue，避免重复。
        安全问题请不要使用本模板，按 https://github.com/jiekemt/CapsLockLite/blob/main/SECURITY.md 私下报告。
  - type: input
    id: version
    attributes:
      label: CapsLock Lite 版本
      description: 侧栏底部或「帮助与关于」里可以看到版本号。
      placeholder: "例如 1.21.4"
    validations:
      required: true
  - type: input
    id: windows
    attributes:
      label: Windows 版本
      description: 运行 `winver` 可以查看版本号。
      placeholder: "例如 Windows 11 23H2 (22631.4460)"
    validations:
      required: true
  - type: input
    id: dpi
    attributes:
      label: 显示缩放比例
      placeholder: "例如 125%、150%，或「多显示器，副屏 100%」"
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      description: 请尽量具体，包括按下的按键、焦点所在的程序。
      placeholder: |
        1. 打开记事本
        2. 按住 Caps Lock 再按 Alt + Q
        3. ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 期望结果
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: 实际结果
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: 日志或截图
      description: 可粘贴 `%APPDATA%\CapsLockLite\error.log` 的相关片段。粘贴前请删除个人信息。
      render: text
  - type: checkboxes
    id: confirm
    attributes:
      label: 确认
      options:
        - label: 我已搜索现有 Issue，没有找到相同问题。
          required: true
        - label: 我使用的是从本仓库 Releases 下载或自行构建的最新版本。
          required: true
