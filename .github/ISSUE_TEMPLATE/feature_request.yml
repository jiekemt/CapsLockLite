name: 功能建议
description: 提出新功能或改进建议
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        请先搜索现有 Issue。描述使用场景比指定实现方式更有帮助。
  - type: textarea
    id: scenario
    attributes:
      label: 使用场景
      description: 你在什么程序、什么工作流里遇到了什么不便？
      placeholder: "例如：在 VS Code 里经常需要……，现在要按……"
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 你希望的做法
      description: 可以是具体的键位、界面或行为设计。
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 考虑过的替代方案
  - type: dropdown
    id: area
    attributes:
      label: 涉及的功能区域
      multiple: true
      options:
        - 快捷键 / 键位
        - 界面与交互
        - 动作与宏
        - 插件
        - 配置与启动
        - 文档
        - 其他
  - type: checkboxes
    id: confirm
    attributes:
      label: 确认
      options:
        - label: 我已搜索现有 Issue，没有找到相同建议。
          required: true
